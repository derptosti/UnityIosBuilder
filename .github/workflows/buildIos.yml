name: General iOS Cloud Builder (Split ZIPs)

on:
  workflow_dispatch:
    inputs:
      base_name:
        description: 'Typ de naam van het ZIP-bestand zonder de .001 (bijv: TreasureHunt.zip)'
        required: true
        default: 'TreasureHunt.zip'

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Combine and Unzip Project Files
      run: |
        echo "Bezig met samenvoegen van de delen voor: ${{ github.event.inputs.base_name }}"
        # Plakt .zip.001, .zip.002 etc. weer aan elkaar tot één werkende zip
        cat "${{ github.event.inputs.base_name }}.00"* > combined_project.zip
        
        # Pakt de samengevoegde zip uit
        unzip combined_project.zip
        ls -la

    - name: Set up Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Build Xcode Project
      run: |
        xcodebuild -project Unity-iPhone.xcodeproj \
                   -scheme Unity-iPhone \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build

    - name: Package into IPA
      run: |
        mkdir -p Payload
        mv build/Release-iphoneos/Unity-iPhone.app Payload/
        zip -r CompiledApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.base_name }}-IPA
        path: CompiledApp.ipa
