name: General iOS Cloud Builder

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Typ de exacte naam van het ZIP-bestand (bijv. treasure.zip of game2.zip)'
        required: true
        default: 'ios-project.zip'

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip Selected Project
      run: |
        echo "Bezig met uitpakken van: ${{ github.event.inputs.zip_name }}"
        unzip "${{ github.event.inputs.zip_name }}"
        ls -la

    - name: Set up Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Build Xcode Project
      run: |
        xcodebuild -project Unity-iPhone.xcodeproj \
                   -scheme Unity-iPhone \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build

    - name: Package into IPA
      run: |
        mkdir -p Payload
        mv build/Release-iphoneos/Unity-iPhone.app Payload/
        zip -r CompiledApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.zip_name }}-IPA
        path: CompiledApp.ipa
